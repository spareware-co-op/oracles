name: Oracles nightly

# Each oracle's image is built from its pinned source and run against the night's jobs from the
# kernel's repository. Images stay in this repository's Actions cache (Docker Buildx's gha cache) and
# are never pushed anywhere (29.20, rule 8, of the kernel architecture); the audit step holds this
# file to that. The kernel's `oracle compare` fails only on a difference nobody has triaged.

on:
  schedule:
    # An hour after the kernel's nightly.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "The kernel's branch or commit to compare"
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"
  JOBS: "20000"
  MESH_JOBS: "2000"
  SKETCH_JOBS: "5000"

jobs:
  # The kernel's oracle tool reaches main with its piece. Until then a night has nothing to run.
  ready:
    name: The kernel's oracle tool is on this ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tool: ${{ steps.tool.outputs.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/spareware
          ref: ${{ inputs.kernel_ref || 'main' }}
          persist-credentials: false
          sparse-checkout: projects/engines/geometry/crates/geom-test/src/bin
      - id: tool
        run: |
          if [ -f projects/engines/geometry/crates/geom-test/src/bin/oracle.rs ]; then
            echo "tool=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the kernel at this ref has no oracle tool yet"
          fi

  geomdl:
    name: geomdl on NURBS
    needs: ready
    if: needs.ready.outputs.tool == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: oracles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/spareware
          ref: ${{ inputs.kernel_ref || 'main' }}
          persist-credentials: false
          path: kernel
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing here can publish, and every base image is pinned
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: The image, from its pinned source
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: oracles/geomdl
          load: true
          push: false
          tags: oracle-geomdl:local
          cache-from: type=gha,scope=geomdl
          cache-to: type=gha,scope=geomdl,mode=max
      - name: Tonight's jobs, the oracle's answers, and the comparison
        working-directory: kernel
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "seed: $seed"
          cargo run --locked --release -p geom-test --bin oracle -- jobs geomdl --seed "$seed" --count "$JOBS" > "$RUNNER_TEMP/jobs.jsonl"
          docker run --rm -i oracle-geomdl:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/answers.jsonl"
          cargo run --locked --release -p geom-test --bin oracle -- compare geomdl --jobs "$RUNNER_TEMP/jobs.jsonl" --answers "$RUNNER_TEMP/answers.jsonl"

  # SMLib's NLib layer, which decision 32.23 limits to evaluation, knot insertion and removal and
  # degree elevation. It runs twice in fresh processes, since a class counts only while its runs agree
  # bit for bit (32.23); a job that reaches a barred routine stops the run, so it can never pass.
  smlib-nlib:
    name: SMLib's NLib on NURBS
    needs: ready
    if: needs.ready.outputs.tool == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: oracles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/spareware
          ref: ${{ inputs.kernel_ref || 'main' }}
          persist-credentials: false
          path: kernel
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing here can publish, and every base image is pinned
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      # An oracle runs once the kernel's catalogue at this ref calls it live: its piece writes its jobs.
      - name: The oracle is live in the kernel's catalogue
        id: live
        working-directory: kernel
        run: |
          if cargo run --locked --release -p geom-test --bin oracle -- list | grep -q "^smlib-nlib OutOfProcess Live "; then
            echo "live=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::smlib-nlib is not live in the kernel's catalogue at this ref"
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.live.outputs.live == 'yes'
      - name: The image, from its pinned source
        if: steps.live.outputs.live == 'yes'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: oracles/smlib-nlib
          load: true
          push: false
          tags: oracle-smlib-nlib:local
          cache-from: type=gha,scope=smlib-nlib
          cache-to: type=gha,scope=smlib-nlib,mode=max
      - name: Tonight's jobs, the oracle's answers twice, and the comparison
        if: steps.live.outputs.live == 'yes'
        working-directory: kernel
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "seed: $seed"
          cargo run --locked --release -p geom-test --bin oracle -- jobs smlib-nlib --seed "$seed" --count "$JOBS" > "$RUNNER_TEMP/jobs.jsonl"
          docker run --rm -i oracle-smlib-nlib:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/answers.jsonl"
          docker run --rm -i oracle-smlib-nlib:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/again.jsonl"
          cmp "$RUNNER_TEMP/answers.jsonl" "$RUNNER_TEMP/again.jsonl"
          cargo run --locked --release -p geom-test --bin oracle -- compare smlib-nlib --jobs "$RUNNER_TEMP/jobs.jsonl" --answers "$RUNNER_TEMP/answers.jsonl"

  meshes:
    name: ${{ matrix.oracle }} on mesh booleans
    needs: ready
    if: needs.ready.outputs.tool == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        oracle: [manifold, cgal, cherchi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: oracles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/spareware
          ref: ${{ inputs.kernel_ref || 'main' }}
          persist-credentials: false
          path: kernel
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing here can publish, and every base image is pinned
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      # An oracle runs once the kernel's catalogue at this ref calls it live: its piece writes its jobs.
      - name: The oracle is live in the kernel's catalogue
        id: live
        working-directory: kernel
        run: |
          if cargo run --locked --release -p geom-test --bin oracle -- list | grep -q "^${{ matrix.oracle }} OutOfProcess Live "; then
            echo "live=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.oracle }} is not live in the kernel's catalogue at this ref"
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.live.outputs.live == 'yes'
      - name: The image, from its pinned source
        if: steps.live.outputs.live == 'yes'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: oracles/${{ matrix.oracle }}
          load: true
          push: false
          tags: oracle-${{ matrix.oracle }}:local
          cache-from: type=gha,scope=${{ matrix.oracle }}
          cache-to: type=gha,scope=${{ matrix.oracle }},mode=max
      - name: Tonight's jobs, the oracle's answers, and the comparison
        if: steps.live.outputs.live == 'yes'
        working-directory: kernel
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "seed: $seed"
          cargo run --locked --release -p geom-test --bin oracle -- jobs "${{ matrix.oracle }}" --seed "$seed" --count "$MESH_JOBS" > "$RUNNER_TEMP/jobs.jsonl"
          docker run --rm -i oracle-${{ matrix.oracle }}:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/answers.jsonl"
          cargo run --locked --release -p geom-test --bin oracle -- compare "${{ matrix.oracle }}" --jobs "$RUNNER_TEMP/jobs.jsonl" --answers "$RUNNER_TEMP/answers.jsonl"

  # The sketch solvers ezpz (KittyCAD, MIT) and fiksi (Linebender, Apache-2.0 OR MIT), the kernel's
  # chapter 15.16 differential partners for piece G222. Each job is drawn from a known truth and the
  # kernel's own solve must reach it, so an answer off the truth is the oracle's. Each runs twice in
  # fresh processes and the two answer files must match byte for byte.
  sketches:
    name: ${{ matrix.oracle }} on sketches
    needs: ready
    if: needs.ready.outputs.tool == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        oracle: [ezpz, fiksi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: oracles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/spareware
          ref: ${{ inputs.kernel_ref || 'main' }}
          persist-credentials: false
          path: kernel
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing here can publish, and every base image is pinned
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      # An oracle runs once the kernel's catalogue at this ref calls it live: its piece writes its jobs.
      - name: The oracle is live in the kernel's catalogue
        id: live
        working-directory: kernel
        run: |
          if cargo run --locked --release -p geom-test --bin oracle -- list | grep -q "^${{ matrix.oracle }} OutOfProcess Live "; then
            echo "live=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.oracle }} is not live in the kernel's catalogue at this ref"
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.live.outputs.live == 'yes'
      - name: The image, from its pinned source
        if: steps.live.outputs.live == 'yes'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: oracles/${{ matrix.oracle }}
          load: true
          push: false
          tags: oracle-${{ matrix.oracle }}:local
          cache-from: type=gha,scope=${{ matrix.oracle }}
          cache-to: type=gha,scope=${{ matrix.oracle }},mode=max
      - name: Tonight's jobs, the oracle's answers twice, and the comparison
        if: steps.live.outputs.live == 'yes'
        working-directory: kernel
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "seed: $seed"
          cargo run --locked --release -p geom-test --bin oracle -- jobs "${{ matrix.oracle }}" --seed "$seed" --count "$SKETCH_JOBS" > "$RUNNER_TEMP/jobs.jsonl"
          docker run --rm -i oracle-${{ matrix.oracle }}:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/answers.jsonl"
          docker run --rm -i oracle-${{ matrix.oracle }}:local < "$RUNNER_TEMP/jobs.jsonl" > "$RUNNER_TEMP/again.jsonl"
          cmp "$RUNNER_TEMP/answers.jsonl" "$RUNNER_TEMP/again.jsonl"
          cargo run --locked --release -p geom-test --bin oracle -- compare "${{ matrix.oracle }}" --jobs "$RUNNER_TEMP/jobs.jsonl" --answers "$RUNNER_TEMP/answers.jsonl"
